jobs:
  release:
    permissions:
      # Creating the GitHub release and uploading archives.
      contents: write
      # Pushing the image to ghcr.io.
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from history, which a shallow clone
          # does not have.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          go-version-file: .tool-versions

      # dockers_v2 builds multi-platform images with buildx. No QEMU is needed:
      # the Dockerfile only COPYs an already cross-compiled binary, so nothing
      # is executed for the non-native platform.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
          version-file: .tool-versions

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
